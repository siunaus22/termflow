name: termflow
description: Cross-platform (Windows + Android) four-level planner (Daily / Weekly / Monthly / Semester) with offline-first Drift SQLite and Supabase sync.
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & routing
  flutter_riverpod: ^2.6.1

  # Local offline-first SQLite (Drift)
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0

  # Cloud sync & Auth (Supabase)
  supabase_flutter: ^2.8.3
  connectivity_plus: ^6.1.2

  # Config & utilities
  shared_preferences: ^2.3.5
  uuid: ^4.5.1
  intl: any

  # UI interactions
  flutter_slidable: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.14

flutter:
  uses-material-design: true
  shaders:
    - shaders/gemini_fluid.frag
